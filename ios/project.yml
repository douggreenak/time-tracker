name: TimeTracker
options:
  bundleIdPrefix: ak.apexengineering
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimeTracker:
    type: application
    platform: iOS
    sources: [TimeTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ak.apexengineering.timetracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TimeTracker/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Time Tracker"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  TimeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TimeTrackerTests]
    dependencies:
      - target: TimeTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ak.apexengineering.timetracker.tests
  TimeTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TimeTrackerUITests]
    dependencies:
      - target: TimeTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ak.apexengineering.timetracker.uitests
        TEST_TARGET_NAME: TimeTracker
schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
    test:
      targets: [TimeTrackerTests, TimeTrackerUITests]
